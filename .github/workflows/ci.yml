name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # -S warning: install.sh's `check && ok || warn` one-liners are safe
        # (ok/warn are printf) but trip info-level SC2015.
        run: shellcheck -S warning hooks/*.sh install.sh tests/*.sh lib/*.sh bin/devflow
      - name: pyyaml for the template-parse lint
        run: pip install --quiet pyyaml
      - name: hook regression suite + plugin lint
        run: bash tests/run.sh
      - name: plugin manifests are valid JSON
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json > /dev/null

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: frontend type-check and build
        working-directory: app
        run: npm ci && npm run build
      - name: rust check
        # `cargo check` rather than a full bundle: it catches every type and
        # borrow error in the part we write, in a fraction of the time a signed
        # .app takes to produce.
        working-directory: app/src-tauri
        run: cargo check --locked
