# devflow project manifest
# Generated by /devflow:init — edit freely. All devflow agents and skills
# read this file to learn how to operate in this project.
# Everything project-specific lives HERE, not in the plugin.
#
# MACHINE-specific values (absolute paths to related repos, anything true only
# on this computer) live in .devflow/project.local.yml — same structure, sparse,
# never committed (gitignored). Agents read project.yml first, then overlay
# project.local.yml on top: local values win.

# Sections you don't need stay empty — that is configuration, not a gap.
# A frontend app may have no db; a library may have no env; an IaC repo may have no auth.

project:
  name: ""
  stack: ""                  # e.g. ".NET microservices", "React + Vite", "Flutter", "Terraform"
  type: ""                   # backend | frontend | mobile | library | infra | mixed — set by init
                             # mixed = monorepo: ONE manifest at the repo root. env.up brings up the
                             # whole stack; services lists every HTTP surface across packages;
                             # test.run is the aggregate command, per-package commands go in comments.
  # committed = devflow files (.devflow/, .claude/settings.json, CLAUDE.md section)
  #             are part of the repo — teammates get them.
  # local     = devflow leaves NO traces in git: files excluded via .git/info/exclude
  #             (never .gitignore — that file is committed and would betray the setup);
  #             decision maps are excluded regardless (see the maps section).
  footprint: committed       # committed | local

env:
  up: ""                     # command starting the local exercise loop: docker compose up,
                             # npm run dev, a simulator boot — whatever "running" means here
  down: ""                   # command that stops it. Foreground-only dev server with no separate
                             # stop command → leave empty with a comment: configuration, not a gap.
  health: []                 # how to know it's ready: URLs to poll, or a command with exit code

auth:
  # Free-form recipe: how an agent gets authenticated access to the protected surface
  # (API token, logged-in session, test account). Must work in Development without
  # human interaction (fixed OTP, seed user, etc.).
  # No protected surface at all? Say so explicitly:
  #   recipe: ""  # none — no protected surface
  # (init writes that marker once the answer is confirmed). A bare "" without the
  # marker means "not established yet" — doctor and test-flow treat the two differently.
  recipe: ""
  # Optional second recipe: token AS A SPECIFIC USER (seed account) — for flows that
  # depend on identity: ownership checks, role-gated status transitions. Needed when
  # the main recipe is service-level (client_credentials). May be multi-step
  # (authorization_code + PKCE, form login) — spell out every step; an agent must not
  # have to reverse-engineer the grant. Empty = flows needing a user token will ask.
  user_recipe: ""

test:
  run: ""                    # command with a clear green/red exit code (unit/default suite)
  integration: ""            # optional: separate integration/e2e suite command

services: {}                 # HTTP surfaces, if any: name: { port: 0, schema: "/swagger/v1/swagger.json", depends_on: [] }
                             # for a frontend this may be just the dev server; empty for libraries/IaC.
                             # port = HOST port (what an agent on this machine can actually reach).
                             # Service behind a gateway with no host mapping (compose `expose`, k8s ClusterIP):
                             # port: "" + comment with the gateway route — never record the container-internal port.

db:
  # Only if the project has local data stores. Local data is PERSISTENT test state:
  # volumes survive up/down/--build. Agents must never destroy it (down -v, drop,
  # truncate) without an explicit user request.
  snapshot: ""               # command dumping local data to a file (run before risky scenarios)
  restore: ""                # command restoring from the snapshot (typically onto a fresh volume)

related_repos: {}            # repos this project must stay in sync with (used by the sync skill).
                             # Optional — single-repo projects leave this empty. Works for any
                             # counterpart: frontend, backend, mobile app, contracts, infra-as-code.
                             # IDENTITY (url/branch/relationship) is team truth — commit it here.
                             # PATH is machine truth — it goes to .devflow/project.local.yml under the
                             # same key (solo projects may keep path here; teams use the overlay).
  # frontend:                # name — pass it to /devflow:sync <name>
  #   url: ""                # remote URL — identifies the repo for the whole team
  #   branch: develop        # branch to track
  #   relationship: consumer # consumer (calls our API) | provider (we call theirs) | sibling (shared contracts/infra)
  # mobile-app:
  #   url: ""
  #   branch: main
  #   relationship: consumer
  # infrastructure:
  #   url: ""
  #   branch: main
  #   relationship: sibling

docs:
  # Map of domain/flow -> doc. Used by sync-docs and the definition-of-done.
  # Value is a file path, or an object when the flow also has a Confluence page:
  #   auth: docs/auth-flow.md
  #   booking: { file: docs/booking.md, confluence: "123456789" }   # page id or full URL
  map: {}
  confluence:
    site: ""                 # e.g. https://yourorg.atlassian.net/wiki — empty = no Confluence integration
    space: ""                # space key where author mode creates new pages
    # Auth via the Atlassian MCP (OAuth) — same as the tracker; credentials never live here.
    # Page updates are outward-facing: always draft → user approval, never allowlist
    # Confluence mutation tools (same rule as tracker mutations).

git:
  base_branch: develop                       # update this branch before starting any task
  branch_pattern: "feature/{key}"            # task branch; {key} = issue key (or kebab-case slug without tracker)
  commit_pattern: "{key}: {type}: {subject}" # e.g. "ABC-12: feat: add user search"; type = conventional commits
  on_done: push                              # push (branch to origin; user opens MR manually) | none (keep local)

tracker:
  system: ""                 # jira | github | linear — empty = no tracker integration
  url: ""                    # e.g. https://yourorg.atlassian.net
  project_key: ""            # e.g. EDEN
  default_issue_type: Task
  labels: []                 # area labels applied to created issues, e.g. [BACKEND] / [FRONTEND] / [DEVOPS]
  language: ""               # language issues are written in (e.g. ru, en)
  # Credentials NEVER live here (this file is committed). Auth via the Atlassian
  # MCP (OAuth) or JIRA_EMAIL / JIRA_API_TOKEN env vars for the REST fallback.

maps:
  # Decision maps (/devflow:map): an idea is carried to ready implementation
  # tickets through recon → requirements → concept → spec → detailed design →
  # slicing, with every decision recorded in a file instead of a session.
  dir: .devflow/maps         # one directory per effort: map.md, issues/, spec.md, design.md, tickets/
  # NEVER committed, whatever project.footprint says: maps are the author's
  # thinking, not team documentation. init excludes them via .git/info/exclude
  # (never .gitignore — that file is committed and would expose the draft).
  # A finished effort is archived into <dir>/.done/<effort>/ — same exclusion,
  # out of sight, still on disk if the reasoning is ever needed again.
  specs_dir: .devflow/specs  # standalone specs written outside any map (/devflow:discuss on its own)
